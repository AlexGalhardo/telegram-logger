name: Release

# 1. On every push to main, release-please opens/updates a "chore(main): release x.y.z" PR
#    with the version bump (package.json + jsr.json) and the CHANGELOG.
# 2. Merging that PR creates the git tag + GitHub Release, and the publish
#    jobs below publish the new version to npm and JSR (independently).
# 3. "Run workflow" (workflow_dispatch) re-publishes the current version; versions that
#    already exist on a registry are skipped, so it is safe to re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm version with Trusted Publishing support
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Publish to npm (skipped if this version already exists)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "npm: $NAME@$VERSION already published, skipping"
          else
            npm publish --access public --provenance
          fi

  publish-jsr:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: JSR publishing from the linked GitHub repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Publish to JSR (skipped if this version already exists)
        run: |
          NAME=$(node -p "require('./jsr.json').name")
          VERSION=$(node -p "require('./jsr.json').version")
          if curl -fsS "https://jsr.io/$NAME/meta.json" | grep -q "\"$VERSION\""; then
            echo "jsr: $NAME@$VERSION already published, skipping"
          else
            npx -y jsr publish
          fi
